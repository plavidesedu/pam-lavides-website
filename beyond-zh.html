<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo">
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-prev" id="lbPrev" aria-label="Previous photo">←</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next" id="lbNext" aria-label="Next photo">→</button>
</div>

<script>
(function(){
  var tiles = Array.prototype.slice.call(document.querySelectorAll('#gallery .zoomable'));
  var box = document.getElementById('lightbox');
  var big = document.getElementById('lbImg');
  var current = 0;

  function show(i){
    current = (i + tiles.length) % tiles.length;
    var img = tiles[current].querySelector('img');
    big.src = img.getAttribute('src');
    big.alt = img.getAttribute('alt');
  }
  function open(i){
    show(i);
    box.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    box.classList.remove('open');
    document.body.style.overflow = '';
    big.src = '';
  }

  tiles.forEach(function(t, i){
    t.addEventListener('click', function(){ open(i); });
    t.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(i); }
    });
  });

  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); show(current - 1); });
  document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); show(current + 1); });
  box.addEventListener('click', function(e){ if(e.target === box) close(); });

  document.addEventListener('keydown', function(e){
    if(!box.classList.contains('open')) return;
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowLeft') show(current - 1);
    if(e.key === 'ArrowRight') show(current + 1);
  });
})();
</script>
